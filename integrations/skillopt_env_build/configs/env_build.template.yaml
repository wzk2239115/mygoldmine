_base_: "@SKILLOPT_ROOT@/configs/_base_/default.yaml"

# Set OPENAI_COMPATIBLE_API_KEY in the environment before running.
model:
  backend: openai_compatible
  optimizer: deepseek/deepseek-v4.1-flash
  target: deepseek/deepseek-v4.1-flash
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  reasoning_effort: medium

train:
  num_epochs: 2
  batch_size: 8
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 4

optimizer:
  learning_rate: 3
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  use_meta_skill: true

evaluation:
  use_gate: true
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

env:
  name: mygoldmine_env_build
  skill_init: "@REPO_ROOT@/integrations/skillopt_env_build/skills/initial.md"
  out_root: "@REPO_ROOT@/rsi/artifacts/env_build"
  dataset_path: "@REPO_ROOT@/integrations/skillopt_env_build/datasets/env_build_v0.json"
  repo_root: "@REPO_ROOT@"
  env_dir: "@REPO_ROOT@/env"
  # existing = score the current env manifests; command = actually run the
  # candidate skill through Claude Code (requires auth and a Docker runner).
  runner_mode: existing
  runner_command: "bash scripts/env/build_env_agent.sh"
  timeout: 3600
  workers: 4
  limit: 0
